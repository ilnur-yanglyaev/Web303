plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.openapi.generator" version "7.9.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.1'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Исправленная конфигурация OpenAPI Generator
openApiGenerate {
	generatorName = "spring"
	inputSpec = "${projectDir}/src/main/resources/openapi/equipment-shop-discount-service-api.yaml".toString()
	outputDir = "${buildDir}/generated".toString()
	apiPackage = "org.example.equipment_shop_discount_service.api"
	modelPackage = "org.example.equipment_shop_discount_service.model"
	configOptions = [
			skipDefaultInterface : "true",
			dateLibrary : "java8-localdatetime",
			serializableModel : "true",
			interfaceOnly : "true",
			hideGenerationTimestamp : "true",
			useBeanValidation : "true",
			generateSupportingFiles : "false",
			useTags : "true",
			library : "spring-cloud",
			openApiNullable : "false",
			useSpringBoot3 : "true"
	]
	typeMappings = [
			"Double": "java.math.BigDecimal"
	]
}

// Убедитесь, что компиляция Java зависит от задачи генерации
compileJava.dependsOn tasks.openApiGenerate

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java', "${buildDir}/generated/src/main/java"]
		}
	}
}